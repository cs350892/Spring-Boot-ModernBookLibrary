spring.application.name=book-library
server.port=8080

# ==============================================================================
# Database Configuration
# ==============================================================================

# --- Option A: In-Memory H2 Database (Active by default for zero-setup instant testing) ---
# Spring Boot will create the tables in-memory automatically on startup.
spring.datasource.url=jdbc:h2:mem:booklibrary_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Web Console: accessible at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Option B: PostgreSQL (Uncomment when you want to connect to your local PostgreSQL server) ---
# spring.datasource.url=jdbc:postgresql://localhost:5432/booklibrary_db
# spring.datasource.username=postgres
# spring.datasource.password=YOUR_POSTGRES_PASSWORD
# spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
# Automatically creates/updates the database tables based on @Entity classes
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries in console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
